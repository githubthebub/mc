# Fly.io config for autoedit (the video tool in autoedit/). Deploy from the repository root:
#   fly deploy
# First-time setup is in autoedit/deploy/DEPLOY.md.
app = "zerophilosophy-autoedit"
primary_region = "iad"

[build]
  dockerfile = "autoedit/Dockerfile"

[env]
  PORT = "8080"
  AUTOEDIT_WHISPER__MODEL = "small"
  AUTOEDIT_RENDER__WORKERS = "3"

[[mounts]]
  source = "autoedit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # renders run in the background long after the last request; never stop the machine under a job
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "performance-2x"
  memory = "8gb"
