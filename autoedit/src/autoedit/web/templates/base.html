<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}autoedit{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">autoedit</a>
  <nav><a href="/">Projects</a><a href="/jobs">Jobs</a></nav>
  <span class="worker {{ 'on' if worker and worker.alive else 'off' }}">worker {{ 'running' if worker and worker.alive else 'stopped' }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
