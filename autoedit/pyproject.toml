[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Turn raw footage or a script into publish-ready YouTube long-form videos and Shorts, applying the video-editor skill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=1.0",
    "faster-whisper>=1.0",
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
fallback = ["pocketsphinx>=5"]
dev = ["pytest>=8"]

[project.scripts]
autoedit = "autoedit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoedit = ["llm/prompts/*.md", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
