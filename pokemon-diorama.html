<title>Grasswood Diorama — a creature battler in a display case</title>
<style>
  :root{
    --desk-1:#1b160f; --desk-2:#0e0b06;
    --wood-1:#7a4a26; --wood-2:#5f3a1f; --wood-3:#402512;
    --brass:#d0a94a; --brass-d:#9c7a2c;
    --ink:#2a1c0d;
    --field-a:#78c96a; --field-b:#69bb59;
    --panel:#f7f3e7; --panel-ink:#20242b; --panel-line:#c7bfa6;
    --accent:#3f9e4d;
    --hp-good:#4cc85a; --hp-mid:#e6c02e; --hp-low:#e0503a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #2c2418 0%, var(--desk-1) 40%, var(--desk-2) 100%);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:#eee; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  /* wood grain of the desk */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(92deg, rgba(0,0,0,.16) 0 3px, rgba(255,255,255,.015) 3px 10px);
    mix-blend-mode:multiply;
  }

  .stage{ perspective:1400px; perspective-origin:50% 34%; }

  /* whole diorama tilts; JS toggles .playing to flatten toward a playable angle */
  .diorama{
    position:relative;
    transform:rotateX(46deg) rotateZ(0deg);
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.22,.61,.24,1);
    filter:drop-shadow(0 40px 34px rgba(0,0,0,.55));
  }
  .playing .diorama{ transform:rotateX(28deg); }

  /* the wooden base + plaque, sitting under the field */
  .base{
    position:absolute; left:50%; top:100%;
    width:520px; height:96px;
    transform:translate(-50%,-14px) rotateX(-90deg);
    transform-origin:top center;
    background:linear-gradient(180deg,var(--wood-1),var(--wood-2) 55%,var(--wood-3));
    border:2px solid #2c1809; border-top:none;
    box-shadow:inset 0 6px 12px rgba(255,255,255,.12), inset 0 -10px 18px rgba(0,0,0,.4);
  }
  .base::after{ /* grain */
    content:""; position:absolute; inset:0; opacity:.35;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, transparent 2px 9px);
  }
  .plaque{
    position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    padding:6px 26px; border-radius:3px;
    background:linear-gradient(180deg,#e7c869,#b98f2f);
    border:1px solid #6b4f16;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.35);
    color:#4a3410; font-family:Georgia,"Times New Roman",serif;
    letter-spacing:.14em; font-weight:700; font-size:17px;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
    white-space:nowrap;
  }

  /* the play area — a wooden rim holds the field, like the case in the photos */
  .field{ position:relative; padding:9px;
    background:linear-gradient(160deg,#8a5a30,#5f3a1f 60%,#412613);
    border:2px solid #2c1809; border-radius:4px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -3px 6px rgba(0,0,0,.4), 0 3px 0 #d0a94a; }
  #game{
    display:block; image-rendering:pixelated;
    width:456px; height:380px;               /* scaled up from native 240x200 */
    background:#69bb59;
    border:2px solid #2c421e;
  }
  @media (max-width:560px){ #game{ width:320px; height:267px; } }

  /* grass fringe standing up around the rim */
  .fringe{ position:absolute; left:0; right:0; height:26px; pointer-events:none;
           background:
             radial-gradient(6px 16px at 6px 26px, #47ad50 60%, transparent 62%) repeat-x,
             radial-gradient(6px 22px at 16px 26px, #3f9e4d 60%, transparent 62%) repeat-x;
           background-size:22px 26px, 22px 26px; }
  .fringe.top{ top:-24px; transform:scaleY(-1); }
  .fringe.bottom{ bottom:-24px; }

  /* the acrylic lid, propped open, with a sheen */
  .lid{
    position:absolute; left:-8px; top:-8px; right:-8px; bottom:-8px;
    transform-origin:top center; transform:translateZ(150px) rotateX(-9deg);
    background:linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.05) 40%, rgba(200,225,255,.10));
    border:2px solid rgba(255,255,255,.35);
    border-radius:2px;
    box-shadow:inset 0 0 30px rgba(255,255,255,.18);
    pointer-events:none;
    transition:opacity .5s, transform 1.1s cubic-bezier(.22,.61,.24,1);
  }
  .lid::before{ content:""; position:absolute; top:0; left:12%; width:34%; height:100%;
    background:linear-gradient(105deg, transparent, rgba(255,255,255,.5) 45%, transparent 60%);
    transform:skewX(-14deg); }
  .playing .lid{ opacity:.42; transform:translateZ(210px) rotateX(-5deg); }

  /* ---- HUD overlays (screen-space, not tilted) ---- */
  .hud{ position:fixed; inset:0; pointer-events:none; z-index:10;
        display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
        padding-bottom:22px; }
  .card{ pointer-events:auto; background:var(--panel); color:var(--panel-ink);
         border:3px solid var(--panel-ink); border-radius:12px;
         box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 0 0 2px #fff;
         padding:14px 16px; }

  /* start screen */
  .title-screen{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, rgba(20,16,10,.2), rgba(8,6,3,.72));
    backdrop-filter:blur(1px); pointer-events:auto; transition:opacity .5s; }
  .title-screen h1{ margin:0; font-size:clamp(30px,6vw,58px); letter-spacing:.02em; line-height:1;
    color:#f4ead0; text-shadow:0 3px 0 #6a4a1c, 0 6px 14px rgba(0,0,0,.6); font-weight:800; }
  .title-screen .kicker{ font-size:13px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--brass); font-weight:700; }
  .title-screen p{ max-width:34ch; color:#d9cfbb; font-size:15px; line-height:1.5; margin:0; }

  .starters{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .starter{ pointer-events:auto; cursor:pointer; width:132px;
    background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.18);
    border-radius:14px; padding:12px 10px 14px; transition:transform .12s, border-color .12s, background .12s; }
  .starter:hover,.starter:focus-visible{ transform:translateY(-4px); border-color:var(--brass); background:rgba(255,255,255,.1); outline:none; }
  .starter canvas{ image-rendering:pixelated; width:88px; height:88px; }
  .starter .nm{ font-weight:800; margin-top:6px; letter-spacing:.02em; }

  .btn{ pointer-events:auto; cursor:pointer; font:inherit; font-weight:800; letter-spacing:.03em;
    color:var(--ink); background:linear-gradient(180deg,#f0d986,var(--brass));
    border:2px solid #6b4f16; border-radius:11px; padding:11px 26px; font-size:16px;
    box-shadow:0 5px 0 var(--brass-d), inset 0 1px 0 rgba(255,255,255,.6); transition:transform .08s, box-shadow .08s; }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--brass-d); }
  .btn.small{ padding:8px 16px; font-size:14px; }

  /* battle hud */
  .battle{ width:min(560px,94vw); display:flex; flex-direction:column; gap:10px; }
  .foe-row,.you-row{ display:flex; align-items:flex-end; gap:12px; }
  .you-row{ flex-direction:row-reverse; }
  .nameplate{ background:var(--panel); color:var(--panel-ink); border:3px solid var(--panel-ink);
    border-radius:10px; padding:8px 12px; min-width:200px; box-shadow:0 6px 0 rgba(0,0,0,.3); }
  .nameplate .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .nameplate .nm{ font-weight:800; letter-spacing:.02em; }
  .nameplate .lv{ font-size:12px; font-weight:700; color:#5b6472; font-variant-numeric:tabular-nums; }
  .badges{ display:flex; gap:5px; margin:5px 0 4px; }
  .tbadge{ font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:#fff; padding:2px 7px; border-radius:999px; text-shadow:0 1px 1px rgba(0,0,0,.35); }
  .hpwrap{ display:flex; align-items:center; gap:6px; }
  .hpwrap .hpk{ font-size:10px; font-weight:800; color:var(--brass-d); }
  .hpbar{ flex:1; height:9px; background:#3a4150; border-radius:999px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
  .hpfill{ height:100%; width:100%; border-radius:999px; transition:width .5s ease, background .3s; background:var(--hp-good); }
  .hpnum{ font-size:11px; font-weight:700; color:#5b6472; text-align:right; margin-top:3px; font-variant-numeric:tabular-nums; }

  .msgbox{ background:var(--panel); color:var(--panel-ink); border:3px solid var(--panel-ink);
    border-radius:12px; padding:12px 14px; min-height:52px; font-size:15px; font-weight:600; line-height:1.35;
    box-shadow:0 8px 0 rgba(0,0,0,.32), inset 0 0 0 2px #fff; display:flex; align-items:center; }
  .msgbox b{ color:var(--accent); }

  .moves{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .move{ pointer-events:auto; cursor:pointer; text-align:left; font:inherit; font-weight:800;
    background:var(--panel); color:var(--panel-ink); border:3px solid var(--panel-ink); border-radius:10px;
    padding:9px 11px; box-shadow:0 5px 0 rgba(0,0,0,.28); transition:transform .08s, box-shadow .08s; }
  .move:hover{ background:#fffef7; }
  .move:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.28); }
  .move .mt{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .move small{ display:block; font-weight:700; color:#6b7280; font-size:11px; margin-top:2px; }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:30;
    background:rgba(20,16,10,.92); color:#f4ead0; border:2px solid var(--brass);
    padding:9px 18px; border-radius:999px; font-weight:700; font-size:14px; letter-spacing:.02em;
    opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

  .party-strip{ position:fixed; top:16px; left:16px; z-index:12; display:flex; gap:6px; pointer-events:none; }
  .pmon{ width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.6);
    background:#2b6; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .pmon.fainted{ background:#555; opacity:.5; }

  .hint{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:12;
    color:#e8dcc2; font-size:12.5px; letter-spacing:.04em; opacity:.85; text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.7); pointer-events:none; }
  .hide{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ .diorama,.lid{ transition:none } }
</style>

<div class="stage">
  <div class="wrap" id="wrap">
    <div class="diorama">
      <div class="field">
        <div class="fringe top"></div>
        <canvas id="game" width="240" height="200"></canvas>
        <div class="fringe bottom"></div>
        <div class="lid"></div>
      </div>
      <div class="base">
        <div class="plaque">GRASSWOOD&nbsp;·&nbsp;ROUTE&nbsp;1</div>
      </div>
    </div>
  </div>
</div>

<div class="party-strip" id="party"></div>
<div class="hint" id="hint"></div>
<div class="toast" id="toast"></div>

<div class="hud" id="hud"></div>

<div class="title-screen" id="title">
  <div class="kicker">Viu Bannes Presents</div>
  <h1>Grasswood Diorama</h1>
  <p>A tiny creature battler sealed under glass. Pick a partner, wander the tall grass, and battle the wild things you flush out.</p>
  <div class="starters" id="starterPick"></div>
  <div style="color:#b7ad98;font-size:12.5px;letter-spacing:.03em">Choose your partner to open the case</div>
</div>

<script>
"use strict";
/* ============================ TYPE SYSTEM ============================ */
const TYPES = {
  normal:"#9099a1", fire:"#e0743a", water:"#4a90d9", grass:"#57a63e",
  electric:"#e6c02e", bug:"#8fb020", flying:"#8aa8e0", rock:"#b7a55a",
  ground:"#c9a24b", poison:"#9a56a8", ghost:"#6a5aa0", ice:"#68c4c9",
};
// attacker -> {defender: multiplier}. Omitted = 1x.
const CHART = {
  fire:    {grass:2, bug:2, ice:2, water:.5, rock:.5, fire:.5},
  water:   {fire:2, rock:2, ground:2, grass:.5, water:.5},
  grass:   {water:2, rock:2, ground:2, fire:.5, bug:.5, flying:.5, grass:.5, poison:.5},
  electric:{water:2, flying:2, ground:0, grass:.5, electric:.5},
  bug:     {grass:2, poison:2, fire:.5, flying:.5, rock:.5, ghost:.5},
  flying:  {grass:2, bug:2, rock:.5, electric:.5},
  rock:    {fire:2, bug:2, flying:2, ice:2, ground:.5},
  ground:  {fire:2, electric:2, rock:2, poison:2, grass:.5, bug:.5, flying:0},
  normal:  {rock:.5, ghost:0},
  poison:  {grass:2, poison:.5, ground:.5, rock:.5, ghost:.5},
  ghost:   {ghost:2, normal:0},
  ice:     {grass:2, ground:2, flying:2, fire:.5, water:.5, ice:.5},
};
function eff(atkType, defTypes){
  let m=1; for(const d of defTypes){ const row=CHART[atkType]; if(row && d in row) m*=row[d]; }
  return m;
}

/* ============================ PIXEL ART ============================ */
// palette-indexed 16x16 sprites. " " = transparent.
const PAL = {
  '.':null,
  k:'#20242b', w:'#ffffff', o:'#e0743a', O:'#b8531f', y:'#f2d24a', Y:'#c9a12c',
  g:'#5fb04a', G:'#3c7d33', b:'#4a90d9', B:'#2c5fa0', c:'#9fe6f0', C:'#5aa9c9',
  p:'#c46bd0', P:'#8a3fa0', r:'#e0503a', R:'#a82f22', t:'#3fb0a0', e:'#d99a5a',
  n:'#7a4a26', s:'#f6e7c0', l:'#c9d86a', d:'#2a1c0d',
};
const SPRITES = {
  // Cindercub — Fire fox pup
  cindercub:[
    "................",
    ".....o....o.....",
    "....oO....Oo....",
    "...ooOo..oOoo...",
    "..ooooooooooo o.",
    "..ooowoooowooo..",
    "..oookoooo koo..",
    "..oooooOOoooooo.",
    "..sooosrrsooo s.",
    "...soooooooss...",
    "....yoooooooy...",
    "....yYoooooYy...",
    ".....oo..oo.....",
    ".....OO..OO.....",
    "................",
    "................",
  ],
  // Sprouten — Grass sprout
  sprouten:[
    ".......G........",
    "......GgG.......",
    ".....GglgG......",
    "......GgG.......",
    ".....ggggg......",
    "....ggGGGgg.....",
    "...ggGgggGgg....",
    "...gGwkgkwGg....",
    "...gGgggggGg....",
    "...ggGrrrGgg....",
    "....gggggggg....",
    ".....gGGGGg.....",
    "....Gg....gG....",
    "....G......G....",
    "................",
    "................",
  ],
  // Dewdrop — Water blob
  dewdrop:[
    "................",
    "......cccc......",
    ".....cbbbbc.....",
    "....cbbbbbbc....",
    "...cbbbbbbbbc...",
    "..cbwbbbbwbbc...",
    "..cbwkbbbkwbc...",
    "..cbbbbbbbbbc...",
    "..cbbbBBbbbbc...",
    "..cbbBrrBbbbc...",
    "...cbbbbbbbc...",
    "....cbbbbbc....",
    ".....cbbbc.....",
    "......cCc......",
    "................",
    "................",
  ],
  // Sparkwing — Bug/Flying butterfly
  sparkwing:[
    "................",
    ".yy.......yy....",
    "yYYy.tt..yYYy...",
    "yYYYy.tt.yYYYy..",
    ".yYYYyttyYYYy...",
    "..yYYytttyYy....",
    "yy.yttwwtty.yy..",
    "yYyttkwwktty Yy.",
    "yYYttttttttyYYy.",
    ".yYy.tttt.yYy...",
    "..y..tPPt..y....",
    ".....tPPt.......",
    "......tt........",
    ".....y..y.......",
    "................",
    "................",
  ],
  // Galeform — Normal/Flying bird (the swellow-like one)
  galeform:[
    "................",
    "..........BB....",
    ".........BbbB...",
    "...BBBBBBbbbb...",
    "..BbbbbbbbbwB...",
    "..BbbbbbbwkbB...",
    ".BbbbbbbbrrbB...",
    ".Bbbbbbbbrrb....",
    "BbbbbbbbbbB.....",
    "BbbbBBBBbB......",
    ".BBB....B.......",
    "..bb...bb.......",
    "..YY...YY.......",
    "..Y.....Y.......",
    "................",
    "................",
  ],
  // Zaptail — Electric mouse
  zaptail:[
    "...y......y.....",
    "...yy....yy...y.",
    "...yYy..yYy..yy.",
    "....yyyyyy..yy..",
    "...yyyyyyyyy y..",
    "..yywyyyywyyy...",
    "..yykyyyykyy y..",
    "..yyyyrryyyyy...",
    "..yyrYYYYryyy...",
    "...yyyyyyyyy....",
    "....yy...yy.....",
    "....Y.....Y.....",
    "..............y.",
    ".............yY.",
    "............yy..",
    "................",
  ],
};
function drawSprite(ctx, key, dx, dy, scale, flip){
  const s=SPRITES[key]; if(!s) return;
  ctx.save();
  if(flip){ ctx.translate(dx+16*scale,dy); ctx.scale(-1,1); dx=0; dy=0; }
  else { ctx.translate(dx,dy); dx=0; dy=0; }
  for(let y=0;y<s.length;y++){ for(let x=0;x<s[y].length;x++){
    const col=PAL[s[y][x]]; if(!col) continue;
    ctx.fillStyle=col; ctx.fillRect(dx+x*scale, dy+y*scale, scale, scale);
  }}
  ctx.restore();
}

/* ============================ DEX ============================ */
const DEX = {
  cindercub:{name:"Cindercub", types:["fire"], base:{hp:30,atk:12,def:8,spd:11},
    moves:["ember","scratch","fireFang","tackle"]},
  sprouten:{name:"Sprouten", types:["grass"], base:{hp:34,atk:10,def:11,spd:8},
    moves:["vineLash","tackle","leafBlade","seedShot"]},
  dewdrop:{name:"Dewdrop", types:["water"], base:{hp:36,atk:10,def:10,spd:9},
    moves:["bubble","tackle","aquaJet","chill"]},
  sparkwing:{name:"Sparkwing", types:["bug","flying"], base:{hp:26,atk:11,def:7,spd:14},
    moves:["gust","bugBite","scratch","tackle"]},
  galeform:{name:"Galeform", types:["normal","flying"], base:{hp:32,atk:13,def:9,spd:13},
    moves:["peck","quickJab","gust","tackle"]},
  zaptail:{name:"Zaptail", types:["electric"], base:{hp:28,atk:12,def:8,spd:15},
    moves:["spark","tackle","thunderNip","quickJab"]},
};
const MOVES = {
  tackle:{name:"Tackle", type:"normal", power:9},
  scratch:{name:"Scratch", type:"normal", power:10},
  quickJab:{name:"Quick Jab", type:"normal", power:8, prio:1},
  ember:{name:"Ember", type:"fire", power:12},
  fireFang:{name:"Fire Fang", type:"fire", power:14},
  bubble:{name:"Bubble", type:"water", power:11},
  aquaJet:{name:"Aqua Jet", type:"water", power:9, prio:1},
  chill:{name:"Chill", type:"ice", power:12},
  vineLash:{name:"Vine Lash", type:"grass", power:12},
  leafBlade:{name:"Leaf Blade", type:"grass", power:14},
  seedShot:{name:"Seed Shot", type:"grass", power:10},
  gust:{name:"Gust", type:"flying", power:11},
  peck:{name:"Peck", type:"flying", power:12},
  bugBite:{name:"Bug Bite", type:"bug", power:12},
  spark:{name:"Spark", type:"electric", power:12},
  thunderNip:{name:"Thunder Nip", type:"electric", power:14},
};

let RNG_STATE = 1234567;                       // deterministic-ish PRNG (no Date/Math.random needed at load)
function rand(){ RNG_STATE = (RNG_STATE*1103515245 + 12345) & 0x7fffffff; return RNG_STATE/0x7fffffff; }
function seedFromInput(){ /* stir the RNG on first real interaction */ RNG_STATE = (RNG_STATE ^ 0x5bd1e995) & 0x7fffffff; }

function makeMon(key, level){
  const d=DEX[key]; const b=d.base;
  const maxhp = Math.floor(b.hp + level*2.4);
  return { key, name:d.name, types:d.types.slice(), level,
    maxhp, hp:maxhp, atk:b.atk+level, def:b.def+Math.floor(level*.7), spd:b.spd+level,
    moves:d.moves.slice(0,4) };
}

/* ============================ GAME STATE ============================ */
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const TILE=20, COLS=12, ROWS=10;
canvas.width=COLS*TILE; canvas.height=ROWS*TILE;

// map: 0 grass path, 1 tall grass, 2 tree(solid), 3 flower
const MAP = [
  [2,2,2,2,2,2,2,2,2,2,2,2],
  [2,1,1,0,0,3,0,0,1,1,1,2],
  [2,1,1,0,2,0,0,0,1,1,1,2],
  [2,0,0,0,0,0,3,0,0,0,0,2],
  [2,0,2,0,1,1,0,0,2,0,0,2],
  [2,0,0,0,1,1,0,0,0,0,3,2],
  [2,3,0,0,0,0,0,2,0,1,1,2],
  [2,1,1,0,2,0,0,0,0,1,1,2],
  [2,1,1,0,0,0,3,0,0,0,0,2],
  [2,2,2,2,2,2,2,2,2,2,2,2],
];
const game = {
  mode:"title",              // title | over | battle
  player:{x:3,y:3, dir:"down", moving:false, px:3*TILE, py:3*TILE, anim:0},
  party:[], steps:0, nextEnc:4+Math.floor(rand()*4),
  battle:null,
};

/* ---------- overworld rendering ---------- */
function tileColor(a){ return a? "#78c96a":"#69bb59"; }
function drawTree(x,y){
  const px=x*TILE, py=y*TILE;
  ctx.fillStyle="#5f3a1f"; ctx.fillRect(px+8,py+12,4,8);
  ctx.fillStyle="#2f6b2a"; ctx.beginPath(); ctx.arc(px+10,py+9,8,0,7); ctx.fill();
  ctx.fillStyle="#3c8a35"; ctx.beginPath(); ctx.arc(px+7,py+7,5,0,7); ctx.fill();
  ctx.fillStyle="#57a63e"; ctx.beginPath(); ctx.arc(px+13,py+8,4,0,7); ctx.fill();
}
function drawTallGrass(x,y){
  const px=x*TILE, py=y*TILE;
  for(let i=0;i<7;i++){
    const gx=px+2+ (i*2.6), gy=py+TILE-2;
    ctx.strokeStyle= i%2? "#2f7f38":"#3f9e4d"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-1.5, gy-9); ctx.stroke();
  }
}
function drawPlayer(){
  const p=game.player;
  const cx=p.px, cy=p.py;
  // shadow
  ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(cx+10,cy+18,7,3,0,0,7); ctx.fill();
  const bob = p.moving? Math.sin(p.anim*0.4)*1.2 : 0;
  const by=cy+bob;
  // legs
  ctx.fillStyle="#3a3f4a"; ctx.fillRect(cx+6,by+13,3,5); ctx.fillRect(cx+11,by+13,3,5);
  // body (cap color varies by dir just for life)
  ctx.fillStyle="#d54b3c"; ctx.fillRect(cx+5,by+7,10,8);
  ctx.fillStyle="#f2f2f2"; ctx.fillRect(cx+7,by+9,6,3);
  // head
  ctx.fillStyle="#e8b98a"; ctx.fillRect(cx+6,by+2,8,6);
  // hair/cap
  ctx.fillStyle="#8fd36a"; ctx.fillRect(cx+5,by+1,10,3); ctx.fillRect(cx+5,by+3,3,2);
  // face dir hint
  ctx.fillStyle="#20242b";
  if(p.dir==="down"){ ctx.fillRect(cx+8,by+5,1,1); ctx.fillRect(cx+11,by+5,1,1); }
  else if(p.dir==="up"){ /* back of head */ ctx.fillStyle="#7ac24f"; ctx.fillRect(cx+6,by+2,8,4); }
  else if(p.dir==="left"){ ctx.fillRect(cx+7,by+5,1,1); }
  else { ctx.fillRect(cx+12,by+5,1,1); }
}
function drawOver(){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    ctx.fillStyle=tileColor((x+y)%2===0); ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
    const t=MAP[y][x];
    if(t===3){ ctx.fillStyle="#e8d34a"; ctx.beginPath(); ctx.arc(x*TILE+10,y*TILE+10,2.4,0,7); ctx.fill();
      ctx.fillStyle="#fff"; ctx.fillRect(x*TILE+9,y*TILE+9,2,2); }
  }
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const t=MAP[y][x];
    if(t===1) drawTallGrass(x,y);
    if(t===2) drawTree(x,y);
  }
  drawPlayer();
}

/* ---------- overworld movement ---------- */
const held={};
function solid(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS) return true; return MAP[y][x]===2; }
function tryStep(){
  const p=game.player; if(p.moving) return;
  let nx=p.x, ny=p.y, dir=p.dir, want=false;
  if(held.up){ ny--; dir="up"; want=true; }
  else if(held.down){ ny++; dir="down"; want=true; }
  else if(held.left){ nx--; dir="left"; want=true; }
  else if(held.right){ nx++; dir="right"; want=true; }
  p.dir=dir;
  if(!want) return;
  if(solid(nx,ny)) return;
  p.tx=nx; p.ty=ny; p.moving=true;
}
function updateOver(dt){
  const p=game.player;
  if(p.moving){
    p.anim+=dt*0.06;
    const tx=p.tx*TILE, ty=p.ty*TILE, sp=2.4*(dt/16);
    if(p.px<tx)p.px=Math.min(tx,p.px+sp); if(p.px>tx)p.px=Math.max(tx,p.px-sp);
    if(p.py<ty)p.py=Math.min(ty,p.py+sp); if(p.py>ty)p.py=Math.max(ty,p.py-sp);
    if(p.px===tx&&p.py===ty){
      p.x=p.tx; p.y=p.ty; p.moving=false;
      game.steps++;
      if(MAP[p.y][p.x]===1){ // in tall grass -> maybe encounter
        game.nextEnc--;
        if(game.nextEnc<=0){ startWildBattle(); }
      }
    }
  } else { tryStep(); }
}

/* ============================ BATTLE ============================ */
const WILD_POOL=["sparkwing","galeform","zaptail","sprouten","dewdrop","cindercub"];
function playerLead(){ return game.party.find(m=>m.hp>0) || game.party[0]; }

function startWildBattle(){
  seedFromInput();
  game.nextEnc = 4+Math.floor(rand()*5);
  const lead=playerLead();
  const key=WILD_POOL[Math.floor(rand()*WILD_POOL.length)];
  const lvl=Math.max(2, lead.level + (Math.floor(rand()*3)-1));
  const foe=makeMon(key, lvl);
  game.battle={ you:lead, foe, busy:false, caught:false, entrance:0 };
  game.mode="battle";
  renderBattle();
  battleMsg(`A wild <b>${foe.name}</b> appeared!`);
}

function hpClass(m){ const r=m.hp/m.maxhp; return r>.5?'var(--hp-good)': r>.22?'var(--hp-mid)':'var(--hp-low)'; }

function typeBadges(types){
  return types.map(t=>`<span class="tbadge" style="background:${TYPES[t]}">${t}</span>`).join("");
}
function nameplate(m, isYou){
  return `<div class="nameplate">
     <div class="top"><span class="nm">${m.name}</span><span class="lv">Lv ${m.level}</span></div>
     <div class="badges">${typeBadges(m.types)}</div>
     <div class="hpwrap"><span class="hpk">HP</span>
       <div class="hpbar"><div class="hpfill" style="width:${Math.max(0,m.hp/m.maxhp*100)}%;background:${hpClass(m)}"></div></div>
     </div>
     ${isYou?`<div class="hpnum">${Math.max(0,m.hp)}/${m.maxhp}</div>`:``}
   </div>`;
}

const hud=document.getElementById('hud');
function renderBattle(){
  const b=game.battle; if(!b) return;
  hud.innerHTML=`
    <div class="battle">
      <div class="foe-row">${nameplate(b.foe,false)}</div>
      <div class="you-row">${nameplate(b.you,true)}</div>
      <div class="msgbox" id="msg"></div>
      <div id="controls"></div>
    </div>`;
  showMoveMenu();
}
function battleMsg(html){ const m=document.getElementById('msg'); if(m) m.innerHTML=html; }

function showMoveMenu(){
  const b=game.battle; const c=document.getElementById('controls'); if(!c) return;
  if(b.busy) return;
  const mv = b.you.moves.map(id=>{
    const m=MOVES[id]; const e=eff(m.type, b.foe.types);
    const tag = e>1?'super effective': e===0?'no effect': e<1?'not very effective':'';
    return `<button class="move" data-mv="${id}">
        <span class="mt"><span>${m.name}</span><span class="tbadge" style="background:${TYPES[m.type]}">${m.type}</span></span>
        <small>PWR ${m.power}${tag?' · '+tag:''}</small>
      </button>`;
  }).join("");
  c.innerHTML = `<div class="moves">${mv}</div>
    <div class="actions" style="margin-top:8px">
      <button class="btn small" data-act="catch">Throw Catch Orb</button>
      <button class="btn small" data-act="run">Run</button>
    </div>`;
  c.querySelectorAll('.move').forEach(el=>el.onclick=()=>playerMove(el.dataset.mv));
  c.querySelector('[data-act="catch"]').onclick=tryCatch;
  c.querySelector('[data-act="run"]').onclick=tryRun;
}
function lockControls(){ const c=document.getElementById('controls'); if(c) c.innerHTML=''; }

function damage(att, def, move){
  const e=eff(move.type, def.types);
  if(e===0) return {dmg:0, e};
  const stab = att.types.includes(move.type)?1.5:1;
  const base = (move.power * att.atk / Math.max(4,def.def));
  const roll = 0.85 + rand()*0.3;
  const dmg = Math.max(1, Math.floor(base*stab*e*roll*0.5));
  return {dmg, e};
}
function effWord(e){ return e>1.9?"It's super effective!": e>1?"It's somewhat effective!": e===0?"It had no effect...": e<1?"It's not very effective...":""; }

async function playerMove(id){
  const b=game.battle; if(b.busy) return; b.busy=true; lockControls();
  const move=MOVES[id];
  battleMsg(`<b>${b.you.name}</b> used ${move.name}!`);
  await wait(650);
  const {dmg,e}=damage(b.you,b.foe,move);
  b.foe.hp=Math.max(0,b.foe.hp-dmg);
  flash(); renderStay(); if(e!==1&&effWord(e)) { battleMsg(effWord(e)); await wait(700); }
  if(b.foe.hp<=0){ await wait(400); return winBattle(); }
  await foeTurn();
  b.busy=false; showMoveMenu();
}
function renderStay(){ // re-render bars/plates without rebuilding controls
  const b=game.battle;
  hud.querySelector('.foe-row').innerHTML=nameplate(b.foe,false);
  hud.querySelector('.you-row').innerHTML=nameplate(b.you,true);
}
async function foeTurn(){
  const b=game.battle;
  const id=b.foe.moves[Math.floor(rand()*b.foe.moves.length)]; const move=MOVES[id];
  battleMsg(`Wild <b>${b.foe.name}</b> used ${move.name}!`);
  await wait(650);
  const {dmg,e}=damage(b.foe,b.you,move);
  b.you.hp=Math.max(0,b.you.hp-dmg);
  flash(); renderStay();
  if(e!==1&&effWord(e)){ battleMsg(effWord(e)); await wait(700); }
  if(b.you.hp<=0){ await wait(400); return faintOut(); }
}

async function winBattle(){
  const b=game.battle; lockControls();
  battleMsg(`Wild <b>${b.foe.name}</b> fainted! <b>${b.you.name}</b> won.`);
  // small level up
  b.you.level++; const bonus=Math.floor(b.you.maxhp*0.06)+2; b.you.maxhp+=Math.floor(2.4); b.you.atk++; b.you.def++; b.you.spd++;
  b.you.hp=Math.min(b.you.maxhp, b.you.hp+bonus);
  await wait(1000);
  battleMsg(`<b>${b.you.name}</b> grew to Lv ${b.you.level}!`);
  await wait(1000);
  endBattle();
}
async function faintOut(){
  const b=game.battle; lockControls();
  battleMsg(`<b>${b.you.name}</b> fainted!`);
  await wait(900);
  const next=game.party.find(m=>m.hp>0);
  if(next && next!==b.you){ b.you=next; renderStay(); battleMsg(`Go, <b>${next.name}</b>!`); await wait(900); b.busy=false; showMoveMenu(); return; }
  battleMsg(`All your partners fainted... they were rushed to safety and revived.`);
  await wait(1200);
  game.party.forEach(m=>m.hp=m.maxhp);
  endBattle();
}
async function tryCatch(){
  const b=game.battle; if(b.busy) return; b.busy=true; lockControls();
  battleMsg(`You threw a <b>Catch Orb</b>!`);
  await wait(800);
  const ratio=b.foe.hp/b.foe.maxhp;
  const chance=0.45 + (1-ratio)*0.5;      // weaker = easier
  const ok = rand()<chance;
  if(ok){
    battleMsg(`Gotcha! <b>${b.foe.name}</b> was caught!`);
    if(game.party.length<6) game.party.push(b.foe);
    b.caught=true;
    await wait(1100); updateParty(); endBattle(); return;
  }
  battleMsg(`Oh no! <b>${b.foe.name}</b> broke free!`);
  await wait(800);
  await foeTurn();
  if(b.you.hp<=0){ return; }
  b.busy=false; showMoveMenu();
}
async function tryRun(){
  const b=game.battle; if(b.busy) return; b.busy=true; lockControls();
  const ok = b.you.spd>=b.foe.spd || rand()<0.6;
  battleMsg(ok?`Got away safely!`:`Couldn't escape!`);
  await wait(700);
  if(ok){ endBattle(); return; }
  await foeTurn(); if(b.you.hp<=0) return;
  b.busy=false; showMoveMenu();
}
function endBattle(){
  game.battle=null; game.mode="over"; hud.innerHTML=''; updateParty();
  setHint("↑↓←→ / WASD to move · rustle the tall grass to find wild creatures");
}

/* ---------- fx ---------- */
function wait(ms){ return new Promise(r=>{ let t=0; const step=()=>{ t+=16; if(t>=ms) r(); else requestAnimationFrame(step); }; requestAnimationFrame(step); }); }
let flashT=0; function flash(){ flashT=8; }

/* ============================ BATTLE CANVAS SCENE ============================ */
function drawBattleScene(){
  // grassy arena with two lily-pad platforms, like the diorama photos
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    ctx.fillStyle=tileColor((x+y)%2===0); ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
  }
  ctx.fillStyle="rgba(255,255,255,.06)";
  for(let y=0;y<ROWS;y+=1){ ctx.fillRect(0,y*TILE,canvas.width,1); }
  const b=game.battle; if(!b) return;
  // foe platform (top-right) & sprite
  pad(168,60); pad(70,150);
  const bob=Math.sin(b.entrance*0.05)*2;
  drawSpriteScaled(b.foe.key, 150, 22+bob, 3.4, true);
  drawSpriteScaled(b.you.key, 40, 108, 3.6, false);
  if(flashT>0){ flashT--; ctx.fillStyle="rgba(255,255,255,"+(flashT/22)+")"; ctx.fillRect(0,0,canvas.width,canvas.height); }
}
function pad(cx,cy){
  ctx.fillStyle="rgba(0,0,0,.12)"; ctx.beginPath(); ctx.ellipse(cx,cy+6,44,14,0,0,7); ctx.fill();
  ctx.fillStyle="#bfe08a"; ctx.beginPath(); ctx.ellipse(cx,cy,44,15,0,0,7); ctx.fill();
  ctx.fillStyle="#a9d06e"; ctx.beginPath(); ctx.ellipse(cx,cy,40,12,0,0,7); ctx.fill();
}
function drawSpriteScaled(key,dx,dy,scale,flip){
  const s=SPRITES[key]; if(!s) return;
  ctx.save();
  if(flip){ ctx.translate(dx+16*scale,dy); ctx.scale(-1,1); }
  else ctx.translate(dx,dy);
  for(let y=0;y<s.length;y++) for(let x=0;x<s[y].length;x++){
    const col=PAL[s[y][x]]; if(!col) continue;
    ctx.fillStyle=col; ctx.fillRect(x*scale,y*scale,scale,scale);
  }
  ctx.restore();
}

/* ============================ MAIN LOOP ============================ */
let last=0;
function loop(ts){
  const dt=Math.min(40, ts-last||16); last=ts;
  if(game.mode==="over"){ updateOver(dt); drawOver(); }
  else if(game.mode==="battle"){ game.battle.entrance+=dt; drawBattleScene(); }
  else { drawOver(); } // title shows the overworld behind
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================ INPUT ============================ */
const KEYMAP={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
addEventListener('keydown',e=>{ const k=KEYMAP[e.key]; if(k){ held[k]=true; e.preventDefault(); } });
addEventListener('keyup',e=>{ const k=KEYMAP[e.key]; if(k){ held[k]=false; } });
// touch dpad via swipe on canvas
let tsx=0,tsy=0;
canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0]; const dx=t.clientX-tsx, dy=t.clientY-tsy;
  Object.keys(held).forEach(k=>held[k]=false);
  if(Math.abs(dx)>Math.abs(dy)){ held[dx>0?"right":"left"]=true; } else { held[dy>0?"down":"up"]=true; }
  setTimeout(()=>Object.keys(held).forEach(k=>held[k]=false),140);
},{passive:true});

/* ============================ TITLE / STARTERS ============================ */
const STARTERS=[
  {key:"cindercub", tag:"Fire"},
  {key:"sprouten", tag:"Grass"},
  {key:"dewdrop", tag:"Water"},
];
function buildStarters(){
  const wrap=document.getElementById('starterPick');
  wrap.innerHTML="";
  STARTERS.forEach(s=>{
    const d=DEX[s.key];
    const el=document.createElement('button'); el.className="starter"; el.type="button";
    const cv=document.createElement('canvas'); cv.width=64; cv.height=64;
    const c=cv.getContext('2d'); c.imageSmoothingEnabled=false; drawSprite(c, s.key, 0,0,4,false);
    el.appendChild(cv);
    const nm=document.createElement('div'); nm.className="nm"; nm.textContent=d.name; el.appendChild(nm);
    const tg=document.createElement('div'); tg.innerHTML=typeBadges(d.types); tg.style.marginTop="4px"; el.appendChild(tg);
    el.onclick=()=>chooseStarter(s.key);
    wrap.appendChild(el);
  });
}
function chooseStarter(key){
  seedFromInput();
  game.party=[ makeMon(key,5) ];
  updateParty();
  document.getElementById('title').style.opacity="0";
  document.body.classList.add('playing');          // flatten the case to a playable angle
  setTimeout(()=>{ document.getElementById('title').classList.add('hide'); },520);
  game.mode="over";
  toast(`You chose ${DEX[key].name}!`);
  setHint("↑↓←→ / WASD to move · swipe on mobile · find wild creatures in the tall grass");
}

/* ---------- party + hint + toast ---------- */
function updateParty(){
  const el=document.getElementById('party'); el.innerHTML="";
  game.party.forEach(m=>{
    const d=document.createElement('div'); d.className="pmon"+(m.hp<=0?" fainted":"");
    d.style.background=TYPES[m.types[0]]; d.title=`${m.name} Lv${m.level}`;
    el.appendChild(d);
  });
}
let hintEl=document.getElementById('hint'); function setHint(t){ hintEl.textContent=t; }
let toastEl=document.getElementById('toast'), toastTimer=0;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800); }

buildStarters();
setHint("Choose a partner to begin");
</script>
